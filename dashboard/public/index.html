<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nizx WaBot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 id="title">Nizx WaBot</h1>

  <section id="login" class="card" hidden>
    <h2>Masuk</h2>
    <input id="pw" type="password" placeholder="Password dashboard" autocomplete="current-password">
    <button id="btn-login">Masuk</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <div id="app" hidden>
    <section class="card">
      <h2>Koneksi Bot</h2>
      <p class="sub">Status koneksi, kode pairing, dan QR.</p>
      <div class="row"><span>Nomor bot</span><b id="st-num">-</b></div>
      <div class="row"><span>Status</span><b id="st-bot">-</b></div>
      <div class="row"><span>Lisensi</span><b id="st-lic">-</b></div>
      <div id="pair-out" hidden>
        <div id="code-box" hidden>
          <p class="hint">Kode pairing (ketuk untuk menyalin)</p>
          <div id="code" class="code"></div>
        </div>
        <img id="qr" alt="QR WhatsApp" hidden>
        <p class="hint" id="pair-hint"></p>
      </div>
    </section>

    <section class="card">
      <h2>Kontrol</h2>
      <p class="sub">Hubungkan, hentikan, atau restart bot.</p>

      <div id="ctl-pair">
        <label>Nomor WhatsApp Bot
          <input id="num" inputmode="numeric" placeholder="628123456789">
        </label>
        <label>Metode
          <select id="method">
            <option value="code">Kode pairing</option>
            <option value="qr">QR (scan dari HP lain)</option>
          </select>
        </label>
        <button id="btn-connect">Hubungkan</button>
      </div>

      <div id="ctl-run" hidden>
        <div class="btns">
          <button id="btn-start" class="ghost" hidden>Hubungkan</button>
          <button id="btn-stop" class="ghost">Hentikan</button>
          <button id="btn-restart" class="ghost">Restart</button>
        </div>
        <button id="btn-logout" class="danger">Logout WhatsApp</button>
      </div>
      <p id="ctl-msg" class="msg"></p>
    </section>

    <section class="card">
      <h2>Pengaturan</h2>
      <label>Prefix perintah <input id="prefix" maxlength="3"></label>
      <label>Nama bot <input id="botname" maxlength="40"></label>
      <button id="btn-save">Simpan</button>
      <p id="set-msg" class="msg"></p>
    </section>

    <section class="card">
      <h2>Fitur</h2>
      <div id="features"></div>
    </section>

    <button id="btn-signout" class="ghost">Keluar dari dashboard</button>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
